project:
  name: saferestore-rf-baseline
  seed: 42
  output_dir: runs/baseline

data:
  train_manifest: data/manifests/train.csv
  val_manifest: data/manifests/val.csv
  test_manifest: data/manifests/test.csv
  image_size: [256, 256]
  num_workers: 4
  weather_types: [rain, fog, rain_fog]

model:
  base_channels: 32
  degradation_dim: 4
  uncertainty_floor: 0.02

training:
  epochs: 80
  batch_size: 8
  learning_rate: 0.0002
  weight_decay: 0.0001
  grad_clip: 1.0
  mixed_precision: true
  early_stopping_patience: 12

loss:
  pixel: 1.0
  edge: 0.2
  ssim: 0.1
  uncertainty: 0.05
  uncertainty_regularization: 0.01
  detection: 0.0
  detection_consistency: 0.0

evaluation:
  save_visuals: true
  max_visuals: 50
  primary_metric: val_loss

