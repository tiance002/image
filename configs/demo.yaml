project:
  name: saferestore-rf-demo
  seed: 42
  output_dir: runs/demo

data:
  train_manifest: data/manifests/train.csv
  val_manifest: data/manifests/val.csv
  test_manifest: data/manifests/test.csv
  image_size: [128, 192]
  num_workers: 0
  weather_types: [rain, fog, rain_fog]

model:
  base_channels: 16
  degradation_dim: 4
  uncertainty_floor: 0.02

training:
  epochs: 3
  batch_size: 4
  learning_rate: 0.0005
  weight_decay: 0.0001
  grad_clip: 1.0
  mixed_precision: false
  early_stopping_patience: 3

loss:
  pixel: 1.0
  edge: 0.2
  ssim: 0.1
  uncertainty: 0.05
  uncertainty_regularization: 0.01
  detection: 0.0
  detection_consistency: 0.0

evaluation:
  save_visuals: true
  max_visuals: 10
  primary_metric: val_loss

