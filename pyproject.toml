[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saferestore-rf"
version = "0.1.0"
description = "Fidelity-preserving rain/fog image restoration for safety-critical road perception"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "numpy>=1.26",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
metrics = [
  "lpips>=0.1.4",
  "scikit-image>=0.22",
]
detection = [
  "ultralytics>=8.3",
]
demo = [
  "gradio>=5,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
